
<!DOCTYPE html>
<html lang="en">
<head>

    <title>CSS Grid Gap Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS Grid Gap Practice</h1>

    <h2>Example 1: Equal Row and Column Gaps</h2>

        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
        <div>Box 4</div>

        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
        <div>Box 4</div>
        <div>Box 5</div>
        <div>Box 6</div>
    </div>
